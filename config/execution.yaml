schema: crypto_ai_swing_execution_v4

authority:
  default_mode: shadow
  strategy_direct_exchange_calls: false
  broker_submission_enabled: false
  automatic_live_promotion: false
  withdrawals_enabled: false

costs:
  fee_bps_per_side: 25.0
  base_slippage_bps: 2.0
  volatility_slippage_coefficient: 0.08
  participation_coefficient: 12.0
  maximum_slippage_bps: 150.0

edge_gate:
  minimum_net_edge_bps: 8.0
  minimum_edge_to_cost_ratio: 1.50
  round_trip: true


paper_evidence:
  allow_uncalibrated_edge_source: true
  maximum_round_trip_cost_bps: 120.0

liquidity:
  maximum_participation_rate: 0.05
  minimum_24h_quote_volume_eur: 250000
  maximum_spread_bps: 35
  reject_stale_orderbook: true
  maximum_market_state_age_seconds: 20

execution:
  paper_enabled: true
  live_enabled: true
  intent_ttl_seconds: 120
  external_adapter_command: []

execution_adapter:
  mode: crypto_execution_authority
  direct_bitvavo_fallback: false
  live_submission_enabled: true
  intent_directory: output/crypto_ai_swing/trade_intents
  command: []
  live_command: []

swing_canary:
  native_crypto_authority: true
  maximum_order_eur: 25
  maximum_total_exposure_eur: 75
  maximum_positions: 3
  maximum_new_orders_per_day: 3
  maximum_risk_per_trade_eur: 2
  maximum_slippage_bps: 25
  native_exchange_stop_required: true
  autoscale: false
  automatic_authority: false
