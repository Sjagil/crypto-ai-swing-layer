name: round41-real-dataflow

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

jobs:
  public-dataflow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Checkout canonical crypto engine
        shell: bash
        run: |
          CRYPTO_COMMIT="$(python -c 'import json; print(json.load(open("config/canonical_crypto_engine.json"))["commit"])')"
          git clone --quiet https://github.com/Sjagil/crypto.git "$GITHUB_WORKSPACE/crypto"
          git -C "$GITHUB_WORKSPACE/crypto" checkout --quiet "$CRYPTO_COMMIT"
          echo "CRYPTO_REPO_PATH=$GITHUB_WORKSPACE/crypto" >> "$GITHUB_ENV"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,crypto-runtime]'
      - name: Real public dataflow
        env:
          ROUND41_REAL_DATA: "1"
        run: |
          python scripts/round41_dataflow_audit.py --network
          python -m pytest -q tests/test_round41_real_dataflow.py
