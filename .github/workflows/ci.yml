name: ci

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,crypto-runtime]'
      - name: Compile
        run: python -m compileall -q src tests
      - name: Ruff
        run: python -m ruff check src tests scripts
      - name: Tests
        run: python -m pytest -q

  safety-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,crypto-runtime]'
      - name: Safety contracts
        run: |
          python -m pytest -q \
            tests/test_round3_execution_fail_closed.py \
            tests/test_round5_crypto_authority_contract.py \
            tests/test_round7_forward_causality.py \
            tests/test_round8_live_evidence_gate.py \
            tests/test_round8_prospective_readiness.py
