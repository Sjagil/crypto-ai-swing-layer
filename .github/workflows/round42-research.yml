name: round42-research-smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

jobs:
  public-research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Checkout pinned canonical crypto
        shell: bash
        run: |
          CRYPTO_COMMIT="$(python -c 'import json; print(json.load(open("config/canonical_crypto_engine.json"))["commit"])')"
          git clone --quiet https://github.com/Sjagil/crypto.git "$GITHUB_WORKSPACE/crypto"
          git -C "$GITHUB_WORKSPACE/crypto" checkout --quiet "$CRYPTO_COMMIT"
          echo "CRYPTO_REPO_PATH=$GITHUB_WORKSPACE/crypto" >> "$GITHUB_ENV"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,crypto-runtime]'
          python -m pip install playwright
          python -m playwright install chromium
      - name: Quant and strategy research
        run: |
          python scripts/round42_strategy_cycle.py --force
          python scripts/round42_browser_research.py
