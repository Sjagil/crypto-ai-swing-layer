[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-ai-swing-layer"
version = "0.14.0"
description = "Crypto-only AI swing research, portfolio, shadow and execution-intent layer"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2",
  "PyYAML>=6,<7",
  "pydantic>=2.7,<3",
  "python-dotenv>=1,<2",
  "pyarrow>=15",
  "duckdb>=1.0,<2",
  "joblib>=1.4,<2",
  "typer>=0.12,<1",
  "rich>=13,<15"
]

[project.optional-dependencies]
crypto-runtime = [
  "aiohttp>=3.10.10,<4",
  "ccxt>=4.5,<4.6",
  "SQLAlchemy>=2.0.36,<3",
  "beautifulsoup4>=4.12.3,<5",
  "lxml>=5.3,<7",
  "feedparser>=6.0.11,<7",
  "dateparser>=1.2.1,<2",
  "playwright>=1.49,<2",
  "hmmlearn>=0.3.3,<0.4"
]
ai = [
  "torch>=2.2",
  "gymnasium>=0.29,<2",
  "stable-baselines3>=2.3,<3",
  "sb3-contrib>=2.3,<3",
  "transformers>=4.40,<6",
  "accelerate>=1,<2",
  "safetensors>=0.4,<1"
]
research = [
  "optuna>=4,<5",
  "skfolio>=0.12,<1",
  "vectorbt>=0.28,<1",
  "cvxpy>=1.5,<2",
  "arch>=7,<9"
]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6"]

[project.scripts]
crypto-swing = "crypto_ai_swing.cli:app"
crypto-ai-swing = "crypto_ai_swing.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
