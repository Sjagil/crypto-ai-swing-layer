schema_version: 3

crypto_repo:
  env: CRYPTO_REPO_PATH
  default: ../crypto
  required: true
  dynamic_imports_enabled: true
  mode: python_library
  source_of_truth: true
  canonical_env_authoritative: true

modules:
  settings: config.settings
  data_loader: data.data_loader
  database: data.database
  websocket: data.websocket_manager
  orderflow: data.orderflow_recorder
  orderbook: data.orderbook_l2
  l2_reconstruction: data.bitvavo_l2_reconstruction_v2
  realtime_candles: data.realtime_candle_builder
  multi_source_runtime: data.multi_source_runtime
  multi_source_platform: data.multi_source_platform
  multi_source_maturation: data.multi_source_maturation
  collector_health: data.collector_health
  feature_store: data.feature_store
  prospective_context: data.prospective_context
  market_intelligence: core.market_intelligence
  opportunity_intelligence: core.opportunity_intelligence
  practical_governance: core.practical_governance
  execution_authority: core.execution_authority
  account_inventory: core.account_inventory
  live_asset_preflight: core.live_asset_preflight
  autonomous_live: core.autonomous_live
  research_features: research.features
  research_factory: research.research_factory
  rss: scrapers.rss
  intelligence: scrapers.intelligence

data_source_fabric:
  mode: canonical_orchestrator_only
  duplicate_network_clients: compatibility_only_not_authoritative
  known_compatibility_clients:
    - src/crypto_ai_swing/execution/bitvavo.py
    - src/crypto_ai_swing/intelligence/cmc_context.py
    - src/crypto_ai_swing/nlp/sources.py
  duplicate_data_store: false
  private_exchange_requests: false
  providers_from_canonical_settings: true
  public_collection_callable: data.multi_source_runtime.run_multi_source_collector
  intelligence_callable: scrapers.intelligence.run_intelligence_pipeline
  rss_callable: scrapers.rss.collect_registered_feeds
  readiness_script: scripts/canonical_data_source_audit.py
  canonical_status_artifacts:
    - output/multi_source/status.json
    - output/multi_source/heartbeat.json
    - data_store/intelligence/scraper_status.json
  source_families:
    exchange_market_data: [bitvavo, kraken, mexc]
    market_context: [coinmarketcap, eodhd, coingecko, polygon]
    macro: [fred, fiscal_data]
    onchain: [defillama, dune, glassnode, cryptoquant]
    derivatives_context: [deribit, coinglass]
    news_sentiment: [alphavantage, currents, marketaux]
    supplementary:
      - coinpaprika
      - fmp
      - twelvedata
      - finnhub
      - marketstack
      - theta_data
      - openfigi
      - openexchangerates

market_data:
  provider: crypto_library
  venue: bitvavo
  primary_signal_timeframe: 1h
  execution_timeframe: 15m
  timeframes: [15m, 1h, 2h, 4h, 1d, 1w]
  use_data_loader: true
  use_ticker: true
  use_trades: true
  use_orderbook: true
  use_microstructure: true
  use_prospective_context: true
  websocket_first: true
  rest_backfill: true

intelligence:
  use_crypto_repo_artifacts: true
  use_canonical_live_collection: true
  use_canonical_web_scrapers: true
  use_canonical_rss: true
  use_parquet: true
  use_json: true
  modules: [scrapers.rss, scrapers.intelligence]

execution_adapter:
  mode: crypto_execution_authority
  direct_bitvavo_fallback: false
  intent_directory: output/crypto_ai_swing/trade_intents
  live_submission_enabled: false
  note: >-
    Live submission remains fail-closed and owned exclusively by Sjagil/crypto.
    Data-source collection and intelligence cannot submit or promote orders.
