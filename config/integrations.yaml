schema_version: 2

crypto_repo:
  env: CRYPTO_REPO_PATH
  default: ../crypto
  required: true
  dynamic_imports_enabled: true
  mode: python_library
  source_of_truth: true

modules:
  settings: config.settings
  data_loader: data.data_loader
  database: data.database
  websocket: data.websocket_manager
  orderflow: data.orderflow_recorder
  orderbook: data.orderbook_l2
  l2_reconstruction: data.bitvavo_l2_reconstruction_v2
  realtime_candles: data.realtime_candle_builder
  multi_source_runtime: data.multi_source_runtime
  multi_source_platform: data.multi_source_platform
  multi_source_maturation: data.multi_source_maturation
  collector_health: data.collector_health
  feature_store: data.feature_store
  prospective_context: data.prospective_context
  market_intelligence: core.market_intelligence
  opportunity_intelligence: core.opportunity_intelligence
  practical_governance: core.practical_governance
  execution_authority: core.execution_authority
  account_inventory: core.account_inventory
  live_asset_preflight: core.live_asset_preflight
  autonomous_live: core.autonomous_live
  research_features: research.features
  research_factory: research.research_factory
  rss: scrapers.rss
  intelligence: scrapers.intelligence

market_data:
  provider: crypto_library
  venue: bitvavo
  primary_signal_timeframe: 1h
  execution_timeframe: 15m
  timeframes: [15m, 1h, 2h, 4h, 1d, 1w]
  use_data_loader: true
  use_ticker: true
  use_trades: true
  use_orderbook: true
  use_microstructure: true
  use_prospective_context: true
  websocket_first: true
  rest_backfill: true

intelligence:
  use_crypto_repo_artifacts: true
  use_parquet: true
  use_json: true
  modules: [scrapers.rss, scrapers.intelligence]

execution_adapter:
  mode: crypto_execution_authority
  direct_bitvavo_fallback: false
  intent_directory: output/crypto_ai_swing/trade_intents
  live_submission_enabled: false
  note: >-
    Live submission stays fail-closed until crypto-library-doctor exposes the
    exact public callable/contract in core.execution_authority on this checkout.
