schema: crypto_ai_swing_autonomy_v2

control_plane:
  fail_closed: true
  automatic_live_promotion: false
  direct_exchange_submission: false

news:
  enabled: true
  source: crypto_repo_rss
  cache_seconds: 300
  maximum_documents: 500
  persist: true
  fail_closed_for_new_entries_on_total_source_failure: false
  enrich_with_crypto_classifier: true

forward_evidence:
  enabled: true
  path: output/crypto_ai_swing/forward/forward.sqlite
  record_shadow: true
  record_paper: true
  record_live: true
  mature_on_cycle: true
  horizons_hours: [1, 4, 24]

research:
  native_crypto_factory: true
  automatic_candidate_generation: true
  automatic_exact_backtest: false
  automatic_paper_promotion: false
  automatic_live_promotion: false
  default_factory_trials: 2000
  native_campaign_default_exact: false
  native_campaign_maximum_rows: 20000

causality:
  enforce_closed_candles: true
  lag_higher_timeframes_to_primary_close: true
